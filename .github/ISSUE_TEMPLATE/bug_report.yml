name: Bug report
description: Something isn't working as documented
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, description: Commands / config (never paste real secrets) }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: DevGuard version }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Node.js version and OS }
    validations: { required: true }
